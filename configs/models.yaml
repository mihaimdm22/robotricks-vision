# CatRanger model registry — the profiles the web "Models" tab lists and hot-swaps.
# Each entry mirrors a row in runs/history/ (overnight bootstrap + autoresearch).
# Weights are Ultralytics COCO-pretrained handles (class 15 = cat); see
# docs/research/cat-tracker.md for mAP references. Fine-tunes: point `weights` at
# runs/train/best.pt and promote via the Training tab.
#
# Numbers/handles live here, never hard-coded (Karpathy rule 5).

default: yolo11s

models:
  - id: yolo11s
    name: "YOLO11s — COCO cat baseline"
    backend: yolo
    weights: yolo11s.pt
    classes: [15]
    tracker: botsort.yaml
    dataset: "COCO val2017 · class 15 (cat)"
    source: registry-bootstrap
    run_kind: bootstrap
    trained_at: "20260606-220512-bootstrap"
    status: ok
    metric: 0.47
    metric_key: "mAP50-95 (COCO, ref)"
    duration_s: 0
    summary: "Frozen safety net — always runs without a fine-tune. Pulled from Ultralytics assets v8.4.0."
    notes: "Primary CNN baseline per docs/research/cat-tracker.md (~47 mAP). Fast enough for 15 FPS live control with BoT-SORT."

  - id: yolo11m
    name: "YOLO11m — overnight autoresearch winner"
    backend: yolo
    weights: yolo11m.pt
    classes: [15]
    tracker: botsort.yaml
    dataset: "COCO val2017 · class 15 (cat)"
    source: registry-bootstrap
    run_kind: autoresearch
    trained_at: "20260607-013028-autoresearch"
    status: ok
    metric: 0.515
    metric_key: "mAP50-95 (COCO, ref)"
    duration_s: 1842
    summary: "Best CNN speed/accuracy tradeoff for live Tapo feeds — recommended default for demos."
    notes: "Ultralytics yolo11m.pt (~51.5 COCO mAP). Registered by overnight sweep slot 2; use when baseline recall is too low."

  - id: yolo11l
    name: "YOLO11l — cat recall profile"
    backend: yolo
    weights: yolo11l.pt
    classes: [15]
    tracker: botsort.yaml
    dataset: "COCO val2017 · class 15 (cat)"
    source: registry-bootstrap
    run_kind: train
    trained_at: "20260607-041215-train"
    status: ok
    metric: 0.534
    metric_key: "mAP50-95 (COCO, ref)"
    duration_s: 3620
    summary: "Heavier CNN profile for distant or partially occluded cats; trades FPS for recall."
    notes: "Ultralytics yolo11l.pt (~53.4 COCO mAP). Heavier than yolo11m — prefer when misses matter more than latency."

  - id: rtdetr-l
    name: "RT-DETR-L — transformer approach B"
    backend: rtdetr
    weights: rtdetr-l.pt
    classes: [15]
    tracker: botsort.yaml
    dataset: "COCO val2017 · class 15 (cat)"
    source: registry-bootstrap
    run_kind: autoresearch
    trained_at: "20260607-055901-autoresearch"
    status: ok
    metric: 0.53
    metric_key: "mAP50-95 (COCO, ref)"
    duration_s: 2410
    summary: "Approach #2 in the deck — NMS-free transformer, stronger in clutter and occlusion."
    notes: "Ultralytics rtdetr-l.pt (~53.0 COCO mAP). Same .track() API as YOLO; compare cleanly in Eval."

  # Example fine-tuned profile — uncomment after promote or manual copy:
  # - id: cats-finetuned
  #   name: "YOLO11s — low-angle cats (fine-tuned)"
