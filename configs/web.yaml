# CatRanger web control platform config. Numbers live here, never hard-coded.
# Loaded by `catranger serve` (M2). Safe, hardware-free defaults: boots on a
# DummyBridge + a sample/synthetic source with zero hardware and zero clicks.

# --- server ---
host: 0.0.0.0          # bind on all interfaces so a phone/laptop on the SAME LAN
                       # can open http://<this-machine-ip>:<port>. Use 127.0.0.1
                       # to restrict to this machine only.
port: 8080
# uvicorn MUST run single-worker, no reload: one RobotController = one writer to
# the serial/BLE link (multiple workers would race the bridge).

# --- video (MJPEG) ---
fps_cap: 15            # cap the publish/encode rate; the Go2 streams ~15 FPS
jpeg_quality: 80       # 1-100; lower = less bandwidth/latency on the LAN
video_stale_ms: 1000   # if no fresh frame within this window, the UI shows "VIDEO STALE"

# --- distance history (live chart + GET /api/history) ---
history_db: outputs/history.sqlite3  # sqlite log of distance over time; survives restarts
history_hz: 4                        # samples/sec persisted (live chart runs faster, in-memory)

# --- live overlay (WS-B0): per-detection JSON the console draws on a canvas over the
# MJPEG frame (crisp labels + failure badges). Thresholds are display heuristics only. ---
overlay:
  low_conf: 0.40       # detection confidence below this is flagged "low_conf"
  wide_ci_frac: 0.30   # distance CI half-width > frac*meters -> "wide_ci"
  disagree_frac: 0.30  # |geometry-depth| / max(geometry,depth) > frac -> "depth_geom_disagree"

# --- safety ---
watchdog_timeout_s: 0.5   # MANUAL dead-man's switch: no heartbeat within this -> stop.
                          # Raise it for laggy Wi-Fi (a phone on a flaky link).
safe_stop_cm: 20          # mirror of the firmware hard-stop; surfaced in the UI.

# --- web console (Next.js front-end) ---
control_idle_timeout_s: 8   # M5 drive token: release it if the holder goes quiet
                            # this long, so another operator can take over.
cors_origins:               # browser origins allowed to call /api/* (the Next.js
                            # dev/prod console). Empty = same-origin only. Add your
                            # LAN console origin for phone access, e.g.:
  - http://localhost:3000
  - http://127.0.0.1:3000

# --- defaults at boot (all overridable from the UI) ---
default_model: yolo11s    # must exist in configs/models.yaml
default_mode: IDLE        # never auto-arm motors on startup
default_robot: dummy      # dummy | usb | bt | ble  (dummy = simulation, no hardware)
default_camera: synthetic # clean hardware-free boot. Set to a webcam index "0",
                          # a sample video path, or an rtsp:// url — or connect one
                          # from the Connections tab. Falls back to synthetic if it
                          # can't open, and the status reports the real source.
