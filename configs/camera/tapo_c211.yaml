# TP-Link Tapo C211 — your live-demo camera. NOT the contest camera.
# fx/fy below are derived from the 110° horizontal FOV at 1920×1080 (pinhole
# estimate). For contest-grade metric distance, refine with one measurement:
#   python scripts/calibrate_camera.py --camera tapo_c211 \
#       --known-height-m 0.297 --distance-m 2.00 --pixel-height-px <h_px>
name: tapo_c211
fx: 642.7  # sonar-calibrated (baseline=0.090m, scale=0.1594, n=22)
fy: 642.7
cx: 960.0
cy: 540.0
width: 1920
height: 1080
fov_deg: 110.0
# Skip FOV undistort — placeholder-era configs used dist_model:none; keep until
# a fine-tune proves rectification helps on this lens.
dist_model: none
mount_height_m: 0.15    # depends on how you mount it on the chassis/servo
needs_calibration: false
# RTSP: set the Camera Account (Tapo app -> Advanced -> Camera Account), then:
#   rtsp://<user>:<pass>@<cam_ip>:554/stream1   (1080p main)
#   rtsp://<user>:<pass>@<cam_ip>:554/stream2   (~360p low-latency)
rtsp: "rtsp://USER:PASS@CAM_IP:554/stream1"
