name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check catranger scripts tests
      - run: uv run ruff format --check catranger scripts tests
      - run: uv run mypy

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run pytest

  import-smoke:
    # The core tests never import the heavy GPU/model modules, so a syntax or
    # bad-import error there would otherwise ship green. This leg installs the CPU
    # torch stack and imports every heavy module to guard the demo path.
    name: import smoke (heavy backends, CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra ml
      - name: import every heavy module
        # `lap` is the BoT-SORT/ByteTrack assignment solver — pipeline.process() ->
        # detector.track() needs it. Importing it here guards against it dropping out
        # of the `ml` extra again (import-smoke never runs track(), so a missing lap
        # would otherwise ship green).
        run: uv run python -c "import catranger.pipeline, catranger.detect, catranger.depth, catranger.track, catranger.viz, lap; print('import smoke OK')"

  web:
    # The base `test` job skips the web route tests (no fastapi). This leg installs
    # the web extra and runs them, plus imports the I/O modules (server/runtime/
    # sources) so a syntax/import error there can't ship green.
    name: web layer (fastapi route contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra web
      - name: import web modules
        run: uv run python -c "import catranger.web.server, catranger.web.runtime, catranger.web.sources; print('web import OK')"
      - name: web route-contract tests
        run: uv run pytest tests/test_web_server.py -q --no-cov
