name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check catranger scripts tests
      - run: uv run ruff format --check catranger scripts tests
      - run: uv run mypy

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run pytest

  import-smoke:
    # The core tests never import the heavy GPU/model modules, so a syntax or
    # bad-import error there would otherwise ship green. This leg installs the CPU
    # torch stack and imports every heavy module to guard the demo path.
    name: import smoke (heavy backends, CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra ml
      - name: import every heavy module
        run: uv run python -c "import catranger.pipeline, catranger.detect, catranger.depth, catranger.track, catranger.viz; print('import smoke OK')"
